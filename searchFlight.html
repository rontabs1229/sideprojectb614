<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search for a Flight</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/index.css" />
  </head>
  <body>
    <section class="search-flight-container flex justify-content-center">
      <div class="search-wrap container shadow">
        <h1 class="hero-title">Search for a Flight</h1>
        <p class="hero-sub">
          Experience the horizon with premium comfort and seamless engineering.
        </p>

        <div class="search-card">
          <div class="tabs">
            <div class="tab-item active">ROUND-TRIP</div>
            <div class="tab-item">FLIGHT DETAILS</div>
          </div>

          <form>
            <div class="row-pair">
              <div class="field-group">
                <label class="field-label">FROM</label>
                <div class="field-box">
                  <i class="fa-solid fa-plane-departure"></i>
                  <input type="text" placeholder="Origin City" />
                </div>
              </div>

              <div class="to-divider">TO</div>

              <div class="field-group">
                <label class="field-label d-none d-sm-block">TO</label>
                <div class="field-box">
                  <i class="fa-solid fa-plane-arrival"></i>
                  <input type="text" placeholder="Destination" />
                </div>
              </div>
            </div>

            <div class="row-pair">
              <div class="field-group">
                <label class="field-label">DEPART</label>
                <div class="field-box">
                  <i class="fa-regular fa-calendar"></i>
                  <input
                    type="text"
                    placeholder="Add Date"
                    onfocus="this.type = 'date'"
                  />
                </div>
              </div>

              <div class="field-group">
                <label class="field-label">RETURN</label>
                <div class="field-box">
                  <i class="fa-regular fa-calendar"></i>
                  <input
                    type="text"
                    placeholder="Add Date"
                    onfocus="this.type = 'date'"
                  />
                </div>
              </div>
            </div>

            <div class="form-footer">
              <div class="promo-row">
                <i class="fa-solid fa-tag"></i>
                <span>Apply Promo Code</span>
              </div>
              <button type="submit" class="btn-search">
                Search Flights <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
